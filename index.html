
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>IPL Ticket Booking</h1>
    <nav>
        <a href="#matches">Matches</a>
        <a href="#book">Book Ticket</a>
    </nav>

    <section id="matches">
        <h2>Upcoming Matches</h2>

        <div class="match-card" data-teams="CSK MI">
            <h3>CSK vs MI</h3>
            <button class="btn-card" data-match="CSK vs MI">Book Ticket</button>
        </div>

        <div class="match-card" data-teams="RCB KKR">
            <h3>RCB vs KKR</h3>
            <button class="btn-card" data-match="RCB vs KKR">Book Ticket</button>
        </div>

        <div class="match-card" data-teams="SRH RR">
            <h3>SRH vs RR</h3>
            <button class="btn-card" data-match="SRH vs RR">Book Ticket</button>
        </div>
    </section>

    <section id="book">
        <h2>Book Your Ticket</h2>
        <form id="bookingForm">
            <label>Name:</label>
            <input type="text" id="name" required>

            <label>Select Match:</label>
            <select id="match" required>
                <option value="">Choose Match</option>
                <option>CSK vs MI</option>
                <option>RCB vs KKR</option>
                <option>SRH vs RR</option>
            </select>

            <button type="submit">Confirm Booking</button>
        </form>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
